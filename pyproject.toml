[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-doubao"
version = "0.1.0"
description = "A Django reusable app for generating images and videos using Doubao API"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Weilu Wang", email = "wandawwl@yahoo.com"},
]
keywords = ["django", "doubao", "ai", "image-generation", "video-generation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "Django>=6.0.5",
    "requests>=2.34.2",
]

[project.urls]
Homepage = "https://github.com/luluww/django-doubao"
Repository = "https://github.com/luluww/django-doubao.git"
Issues = "https://github.com/luluww/django-doubao/issues"

[tool.setuptools.packages.find]
include = ["doubao", "doubao.*"]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-django>=4.5",
    "pytest-cov>=4.0",
    "requests-mock>=1.11",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.test_settings"
python_files = "test_*.py"
addopts = "--tb=short"
