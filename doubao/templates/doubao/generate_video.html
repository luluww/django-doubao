<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doubao Video Generator</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans SC', sans-serif;
            background: #f5f0e8;
            margin: 0;
            padding: 20px;
            color: #1e1a16;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .content-card {
            background: #fffef7;
            border-radius: 24px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.05);
            overflow: hidden;
            border: 1px solid #e2dcd2;
        }
        .card-header {
            padding: 20px 28px;
            background: #faf6ef;
            border-bottom: 1px solid #e2dcd2;
        }
        .card-header h5 {
            margin: 0 0 6px 0;
            font-size: 1.5rem;
            font-weight: 600;
        }
        .card-header small {
            font-size: 0.85rem;
            color: #6b5c4c;
        }
        .card-body {
            padding: 28px;
        }
        .mb-3 {
            margin-bottom: 1.5rem;
        }
        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #2c241e;
        }
        .form-control, .form-select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #cdc2b4;
            border-radius: 12px;
            background: white;
            font-size: 1rem;
            transition: 0.2s;
        }
        .form-control:focus, .form-select:focus {
            outline: none;
            border-color: #b97f48;
            box-shadow: 0 0 0 2px rgba(185, 127, 72, 0.2);
        }
        textarea.form-control {
            resize: vertical;
        }
        .row {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .col-md-6 {
            flex: 1;
            min-width: 200px;
        }
        .alert {
            background: #e3f2fd;
            padding: 10px 12px;
            border-radius: 12px;
            color: #0c5460;
        }
        .image-preview {
            max-width: 100%;
            max-height: 300px;
            border-radius: 12px;
            margin-top: 10px;
            border: 2px solid #cdc2b4;
        }
        .info-text {
            font-size: 0.8rem;
            color: #8b7a6b;
            margin-top: 6px;
        }
        .text-muted {
            color: #8b7a6b;
        }
        .text-center {
            text-align: center;
        }
        .mt-2 {
            margin-top: 12px;
        }
        .btn {
            padding: 8px 20px;
            border-radius: 40px;
            border: none;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.9rem;
        }
        .btn-primary {
            background: #8b5a3c;
            color: white;
        }
        .btn-primary:hover {
            background: #6f472e;
        }
        .btn-outline-primary {
            background: transparent;
            border: 1px solid #8b5a3c;
            color: #8b5a3c;
        }
        .btn-outline-primary:hover {
            background: #8b5a3c10;
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .result-section {
            margin-top: 30px;
            padding: 15px;
            background: #fefaf5;
            border-radius: 20px;
            border: 1px solid #e2dcd2;
        }
        .result-section h6 {
            margin-bottom: 15px;
            color: #b97f48;
        }
        .video-container, .lastframe-container {
            margin-top: 20px;
            text-align: center;
        }
        .video-container video {
            max-width: 100%;
            border-radius: 12px;
        }
        .lastframe-container img {
            max-width: 100%;
            max-height: 300px;
            border-radius: 12px;
            border: 1px solid #ddd2c4;
        }
        .action-buttons {
            margin-top: 15px;
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        #global-spinner {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255,255,255,0.3);
            border-top-color: #b97f48;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
<div id="app" class="container py-4">
    <div class="content-card">
        <div class="card-header">
            <h5 class="mb-0">🎬 Generate Video</h5>
            <small>Turn an image into a dynamic short video with AI</small>
        </div>

        <div class="card-body">
            <form @submit.prevent="submitForm">
                {% csrf_token %}

                <!-- Image selection area -->
                <div class="mb-3">
                    <label class="form-label">🖼️ Reference Image</label>
                    <div class="row">
                        <div class="col-md-6">
                            <input type="file" class="form-control" accept="image/*" @change="handleImageFileChange">
                            <div class="info-text">Upload a local image (or use the one passed from previous page)</div>
                        </div>
                        <div class="col-md-6" v-if="urlImage">
                            <div class="alert mb-0">
                                <small>📎 Image from previous page</small>
                            </div>
                        </div>
                    </div>
                    <div class="text-center mt-2">
                        <img v-if="previewUrl" :src="previewUrl" class="image-preview" alt="preview">
                        <p v-else class="info-text text-muted">No image. Please upload or use the one from previous step.</p>
                    </div>
                </div>

                <!-- Prompt -->
                <div class="mb-3">
                    <label for="promptInput" class="form-label">✨ Video Prompt</label>
                    <textarea id="promptInput" class="form-control" rows="3"
                        placeholder="e.g., The little girl and her cat are happily spinning in a maple forest, autumn breeze blowing..."
                        v-model="prompt"></textarea>
                </div>

                <!-- Duration (5-12 seconds) -->
                <div class="mb-3">
                    <label class="form-label">⏱️ Duration (seconds)</label>
                    <select class="form-select" v-model="duration">
                        <option v-for="sec in durationOptions" :value="sec" v-text="sec + ' sec'"></option>
                    </select>
                </div>

                <!-- Resolution (currently only 480p) -->
                <div class="mb-3">
                    <label class="form-label">📺 Resolution</label>
                    <select class="form-select" v-model="selectedResolution" disabled>
                        <option v-for="resolution in resolutionOptions" :value="resolution" v-text="resolution"></option>
                    </select>
                    <div class="info-text">Currently only 480p is supported</div>
                </div>

                <!-- Aspect ratio -->
                <div class="mb-3">
                    <label class="form-label">📐 Aspect Ratio</label>
                    <select class="form-select" v-model="selectedRatio">
                        <option v-for="ratio in ratioOptions" :value="ratio" v-text="ratio"></option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary" :disabled="isSubmitting">
                    🚀 Generate Video
                </button>
            </form>

            <!-- Result area: video + last frame -->
            <div v-if="videoUrl" class="result-section">
                <div class="video-container">
                    <h6>🎥 Generated Video</h6>
                    <video controls :src="videoUrl"></video>
                    <div class="action-buttons">
                        <button class="btn btn-outline-primary" @click="downloadVideo">⬇️ Download Video</button>
                    </div>
                </div>

                <div v-if="lastFrameUrl" class="lastframe-container">
                    <h6>🖼️ Last Frame</h6>
                    <img :src="lastFrameUrl" alt="Last frame">
                    <div class="action-buttons">
                        <button class="btn btn-outline-primary" @click="downloadLastFrame">⬇️ Download Last Frame</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Simple spinner overlay -->
<div id="global-spinner">
    <div class="spinner"></div>
</div>

<script>
    const { createApp, ref, computed, onMounted } = Vue;

    // Simple spinner controls
    const spinner = {
        show() {
            const el = document.getElementById('global-spinner');
            if (el) el.style.display = 'flex';
        },
        hide() {
            const el = document.getElementById('global-spinner');
            if (el) el.style.display = 'none';
        }
    };

    // Data from Django template
    let ratioData = {{ ratios|safe }};
    let resolutionData = {{ resolutions|safe }};
    let maxDurationValue = {{ max_duration }};

    createApp({
        setup() {
            const prompt = ref('');
            const duration = ref(5);
            const selectedRatio = ref(ratioData[0] || "9:16");
            const ratioOptions = ref(ratioData);
            const selectedResolution = ref(resolutionData[0] || "480p");
            const resolutionOptions = ref(resolutionData);
            const isSubmitting = ref(false);
            const videoUrl = ref('');
            const lastFrameUrl = ref('');
            const selectedImageFile = ref(null);
            const urlImage = ref(null);
            const previewUrl = ref('');

            const durationOptions = computed(() => {
                const max = maxDurationValue;
                return Array.from({ length: max - 4 }, (_, i) => i + 5);
            });

            const getQueryParam = (param) => {
                const urlParams = new URLSearchParams(window.location.search);
                return urlParams.get(param);
            };

            const loadImageFromParam = async () => {
                const imageGenId = getQueryParam('image_gen_id');
                const imageUrlParam = getQueryParam('image_url');
                if (imageGenId) {
                    try {
                        const response = await fetch(`/doubao/image/get-url/${imageGenId}`);
                        const data = await response.json();
                        if (data.image_url) {
                            urlImage.value = data.image_url;
                            previewUrl.value = data.image_url;
                        } else {
                            alert("Unable to get image address.");
                        }
                    } catch (error) {
                        console.error(error);
                        alert("Failed to fetch image.");
                    }
                } else if (imageUrlParam) {
                    urlImage.value = imageUrlParam;
                    previewUrl.value = imageUrlParam;
                }
            };

            const handleImageFileChange = (event) => {
                const file = event.target.files[0];
                if (file) {
                    selectedImageFile.value = file;
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        previewUrl.value = e.target.result;
                    };
                    reader.readAsDataURL(file);
                    urlImage.value = null;
                }
            };

            const submitForm = async () => {
                if (!selectedImageFile.value && !urlImage.value) {
                    alert("Please upload an image or use the one from the previous page.");
                    return;
                }
                if (!prompt.value.trim()) {
                    alert("Please enter a video description.");
                    return;
                }

                isSubmitting.value = true;
                spinner.show();

                const formData = new FormData();
                formData.append('prompt', prompt.value);
                formData.append('duration', duration.value);
                formData.append('resolution', selectedResolution.value);
                formData.append('ratio', selectedRatio.value);

                if (selectedImageFile.value) {
                    formData.append('image', selectedImageFile.value);
                } else if (urlImage.value) {
                    formData.append('image_url', urlImage.value);
                }

                const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;
                formData.append('csrfmiddlewaretoken', csrfToken);

                try {
                    const response = await fetch("{% url 'doubao:generate_video' %}", {
                        method: 'POST',
                        body: formData,
                        headers: { 'X-Requested-With': 'XMLHttpRequest' }
                    });
                    const data = await response.json();
                    if (response.ok && data.video_url) {
                        videoUrl.value = data.video_url;
                        lastFrameUrl.value = data.last_frame_url || '';
                        alert("🎉 Video generated successfully!");
                        document.querySelector('.result-section')?.scrollIntoView({ behavior: 'smooth' });
                    } else {
                        throw new Error(data.error || "Generation failed");
                    }
                } catch (error) {
                    console.error(error);
                    alert(`🐱 Error: ${error.message}`);
                } finally {
                    isSubmitting.value = false;
                    spinner.hide();
                }
            };

            const downloadVideo = () => {
                if (videoUrl.value) {
                    window.open(videoUrl.value, '_blank');
                }
            };

            const downloadLastFrame = () => {
                if (lastFrameUrl.value) {
                    window.open(lastFrameUrl.value, '_blank');
                }
            };

            onMounted(() => {
                loadImageFromParam();
            });

            return {
                prompt,
                duration,
                durationOptions,
                selectedResolution,
                resolutionOptions,
                selectedRatio,
                ratioOptions,
                isSubmitting,
                videoUrl,
                lastFrameUrl,
                previewUrl,
                selectedImageFile,
                urlImage,
                handleImageFileChange,
                submitForm,
                downloadVideo,
                downloadLastFrame
            };
        }
    }).mount('#app');
</script>
</body>
</html>
